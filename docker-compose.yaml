# Demo stack: synthetic service -> Prometheus (with generated SLO rules) -> Grafana (generated dashboard).
#   make stack-up      then open http://localhost:3000 (anonymous viewer) and http://localhost:9090/alerts
#   make chaos         inject 20% errors for 10 minutes and watch the page alert fire
services:
  demo:
    image: python:3.12-slim
    command: ["python", "/app/service.py"]
    environment:
      RPS: "40"
    volumes:
      - ./demo/service.py:/app/service.py:ro
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./examples/http-api/out:/etc/prometheus/rules:ro
    ports: ["9090:9090"]
    depends_on: [demo]

  grafana:
    image: grafana/grafana-oss:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/checkout-api.dashboard.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./examples/http-api/out:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
