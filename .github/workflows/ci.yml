name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: "3.5.0"

jobs:
  test:
    name: lint + test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: make install
      - run: make lint
      - run: make test
      - name: Committed example outputs are up to date
        run: make check-examples

  rules:
    name: promtool + helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install promtool
        run: |
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          promtool --version
      - uses: azure/setup-helm@v4
      - run: make check-rules
      - run: make helm
      - run: make demo
