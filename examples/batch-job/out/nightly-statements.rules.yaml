# Generated by slo-toolkit from the nightly-statements spec. Do not edit by hand;
# change the spec and re-run `slo-toolkit generate`.
groups:
- name: slo-nightly-statements-runs
  rules:
  - record: slo:sli_error:ratio_rate5m
    expr: |-
      1 - (
        (sum(increase(batch_job_runs_total{job="nightly-statements",result="success"}[5m])))
        /
        (sum(increase(batch_job_runs_total{job="nightly-statements"}[5m])))
      )
    labels:
      slo_service: nightly-statements
      slo_name: runs
      slo_owner: data-platform
  - record: slo:sli_error:ratio_rate30m
    expr: |-
      1 - (
        (sum(increase(batch_job_runs_total{job="nightly-statements",result="success"}[30m])))
        /
        (sum(increase(batch_job_runs_total{job="nightly-statements"}[30m])))
      )
    labels:
      slo_service: nightly-statements
      slo_name: runs
      slo_owner: data-platform
  - record: slo:sli_error:ratio_rate1h
    expr: |-
      1 - (
        (sum(increase(batch_job_runs_total{job="nightly-statements",result="success"}[1h])))
        /
        (sum(increase(batch_job_runs_total{job="nightly-statements"}[1h])))
      )
    labels:
      slo_service: nightly-statements
      slo_name: runs
      slo_owner: data-platform
  - record: slo:sli_error:ratio_rate6h
    expr: |-
      1 - (
        (sum(increase(batch_job_runs_total{job="nightly-statements",result="success"}[6h])))
        /
        (sum(increase(batch_job_runs_total{job="nightly-statements"}[6h])))
      )
    labels:
      slo_service: nightly-statements
      slo_name: runs
      slo_owner: data-platform
  - record: slo:sli_error:ratio_rate3d
    expr: |-
      1 - (
        (sum(increase(batch_job_runs_total{job="nightly-statements",result="success"}[3d])))
        /
        (sum(increase(batch_job_runs_total{job="nightly-statements"}[3d])))
      )
    labels:
      slo_service: nightly-statements
      slo_name: runs
      slo_owner: data-platform
  - record: slo:sli_bad:rate5m
    expr: |-
      (sum(increase(batch_job_runs_total{job="nightly-statements"}[5m])))
      -
      (sum(increase(batch_job_runs_total{job="nightly-statements",result="success"}[5m])))
    labels:
      slo_service: nightly-statements
      slo_name: runs
      slo_owner: data-platform
  - record: slo:sli_total:rate5m
    expr: sum(increase(batch_job_runs_total{job="nightly-statements"}[5m]))
    labels:
      slo_service: nightly-statements
      slo_name: runs
      slo_owner: data-platform
  - record: slo:period_error:ratio
    expr: |-
      sum_over_time(slo:sli_bad:rate5m{slo_service="nightly-statements", slo_name="runs"}[30d])
      /
      sum_over_time(slo:sli_total:rate5m{slo_service="nightly-statements", slo_name="runs"}[30d])
    labels:
      slo_service: nightly-statements
      slo_name: runs
      slo_owner: data-platform
      slo_window: 30d
  - record: slo:objective:ratio
    expr: vector(0.99)
    labels:
      slo_service: nightly-statements
      slo_name: runs
      slo_owner: data-platform
  - record: slo:error_budget:ratio
    expr: vector(0.01)
    labels:
      slo_service: nightly-statements
      slo_name: runs
      slo_owner: data-platform
  - record: slo:error_budget_remaining:ratio
    expr: 1 - (slo:period_error:ratio{slo_service="nightly-statements", slo_name="runs"} / 0.01)
    labels:
      slo_service: nightly-statements
      slo_name: runs
      slo_owner: data-platform
      slo_window: 30d
  - alert: NightlyStatementsRunsErrorBudgetBurn
    expr: |-
      (
        slo:sli_error:ratio_rate1h{slo_service="nightly-statements", slo_name="runs"} > (14.4 * 0.01)
        and
        slo:sli_error:ratio_rate5m{slo_service="nightly-statements", slo_name="runs"} > (14.4 * 0.01)
      )
      or
      (
        slo:sli_error:ratio_rate6h{slo_service="nightly-statements", slo_name="runs"} > (6 * 0.01)
        and
        slo:sli_error:ratio_rate30m{slo_service="nightly-statements", slo_name="runs"} > (6 * 0.01)
      )
    labels:
      severity: warning
      route: team-channel
      slo_service: nightly-statements
      slo_name: runs
    annotations:
      summary: nightly-statements runs SLO is burning its error budget too fast
      description: 'Objective 99% over 30d. Fires when the error rate would spend 2% of the 30d budget in 1h (burn rate 14.4x, confirmed over 5m); 5% of the 30d budget in 6h (burn rate 6x, confirmed over 30m). Long-window error ratio: {{ $value | humanizePercentage }}.'
  - alert: NightlyStatementsRunsErrorBudgetBurn
    expr: |-
      (
        slo:sli_error:ratio_rate3d{slo_service="nightly-statements", slo_name="runs"} > (1 * 0.01)
        and
        slo:sli_error:ratio_rate6h{slo_service="nightly-statements", slo_name="runs"} > (1 * 0.01)
      )
    labels:
      severity: info
      slo_service: nightly-statements
      slo_name: runs
    annotations:
      summary: nightly-statements runs SLO is burning its error budget too fast
      description: 'Objective 99% over 30d. Fires when the error rate would spend 10% of the 30d budget in 3d (burn rate 1x, confirmed over 6h). Long-window error ratio: {{ $value | humanizePercentage }}.'
