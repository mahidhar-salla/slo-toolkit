      (sum(rate(http_requests_total{job="checkout-api"}[6h])))
    labels:
      slo_service: checkout-api
      slo_name: availability
      slo_owner: payments-platform
      tier: '1'
  - record: slo:sli_error:ratio_rate1d
    expr: |-
      (sum(rate(http_requests_total{job="checkout-api",code=~"5.."}[1d])))
      /
      (sum(rate(http_requests_total{job="checkout-api"}[1d])))
    labels:
      slo_service: checkout-api
      slo_name: availability
      slo_owner: payments-platform
      tier: '1'
  - record: slo:sli_error:ratio_rate3d
    expr: |-
      (sum(rate(http_requests_total{job="checkout-api",code=~"5.."}[3d])))
      /
      (sum(rate(http_requests_total{job="checkout-api"}[3d])))
    labels:
      slo_service: checkout-api
      slo_name: availability
      slo_owner: payments-platform
      tier: '1'
  - record: slo:period_error:ratio
    expr: avg_over_time(slo:sli_error:ratio_rate5m{slo_service="checkout-api", slo_name="availability"}[30d])
    labels:
      slo_service: checkout-api
      slo_name: availability
      slo_owner: payments-platform
      tier: '1'
      slo_window: 30d
  - record: slo:objective:ratio
    expr: vector(0.999)
    labels:
      slo_service: checkout-api
      slo_name: availability
      slo_owner: payments-platform
      tier: '1'
  - record: slo:error_budget:ratio
    expr: vector(0.001)
    labels:
      slo_service: checkout-api
      slo_name: availability
      slo_owner: payments-platform
      tier: '1'
  - record: slo:error_budget_remaining:ratio
    expr: 1 - (slo:period_error:ratio{slo_service="checkout-api", slo_name="availability"} / 0.001)
    labels:
      slo_service: checkout-api
      slo_name: availability
      slo_owner: payments-platform
      tier: '1'
      slo_window: 30d
  - alert: CheckoutApiAvailabilityErrorBudgetBurn
    expr: |-
      (
        slo:sli_error:ratio_rate1h{slo_service="checkout-api", slo_name="availability"} > (14.4 * 0.001)
        and
        slo:sli_error:ratio_rate5m{slo_service="checkout-api", slo_name="availability"} > (14.4 * 0.001)
      )
      or
      (
        slo:sli_error:ratio_rate6h{slo_service="checkout-api", slo_name="availability"} > (6 * 0.001)
        and
        slo:sli_error:ratio_rate30m{slo_service="checkout-api", slo_name="availability"} > (6 * 0.001)
      )
    labels:
      severity: page
      slo_service: checkout-api
      slo_name: availability
    annotations:
      summary: checkout-api availability SLO is burning its error budget too fast
      description: 'Objective 99.9% over 30d. Fires when the error rate would spend 2% of the 30d budget in 1h (burn rate 14.4x, confirmed over 5m); 5% of the 30d budget in 6h (burn rate 6x, confirmed over 30m). Long-window error ratio: {{ $value | humanizePercentage }}.'
      runbook_url: https://github.com/mahidhar-salla/slo-toolkit/blob/main/docs/runbooks/error-budget-burn.md
  - alert: CheckoutApiAvailabilityErrorBudgetBurn
    expr: |-
      (
        slo:sli_error:ratio_rate1d{slo_service="checkout-api", slo_name="availability"} > (3 * 0.001)
        and
        slo:sli_error:ratio_rate2h{slo_service="checkout-api", slo_name="availability"} > (3 * 0.001)
      )
      or
      (
        slo:sli_error:ratio_rate3d{slo_service="checkout-api", slo_name="availability"} > (1 * 0.001)
        and
        slo:sli_error:ratio_rate6h{slo_service="checkout-api", slo_name="availability"} > (1 * 0.001)
      )
    labels:
      severity: ticket
      slo_service: checkout-api
      slo_name: availability
    annotations:
      summary: checkout-api availability SLO is burning its error budget too fast
      description: 'Objective 99.9% over 30d. Fires when the error rate would spend 10% of the 30d budget in 1d (burn rate 3x, confirmed over 2h); 10% of the 30d budget in 3d (burn rate 1x, confirmed over 6h). Long-window error ratio: {{ $value | humanizePercentage }}.'
