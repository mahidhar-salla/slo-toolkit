# Generated by slo-toolkit from the checkout-api spec. Do not edit by hand;
# change the spec and re-run `slo-toolkit generate`.
groups:
- name: slo-checkout-api-availability
  rules:
  - record: slo:sli_error:ratio_rate5m
    expr: |-
      (sum(rate(http_requests_total{job="checkout-api",code=~"5.."}[5m])))
      /
      (sum(rate(http_requests_total{job="checkout-api"}[5m])))
    labels:
      slo_service: checkout-api
      slo_name: availability
      slo_owner: payments-platform
      tier: '1'
  - record: slo:sli_error:ratio_rate30m
    expr: |-
      (sum(rate(http_requests_total{job="checkout-api",code=~"5.."}[30m])))
