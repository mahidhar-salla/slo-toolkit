# Generated by slo-toolkit from the customer-profile spec. Do not edit by hand;
# change the spec and re-run `slo-toolkit generate`.
groups:
- name: slo-customer-profile-availability
  rules:
  - record: slo:sli_error:ratio_rate5m
    expr: |-
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService",grpc_code=~"Unknown|Internal|Unavailable|DeadlineExceeded|DataLoss"}[5m])))
      /
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService"}[5m])))
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
  - record: slo:sli_error:ratio_rate30m
    expr: |-
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService",grpc_code=~"Unknown|Internal|Unavailable|DeadlineExceeded|DataLoss"}[30m])))
      /
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService"}[30m])))
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
  - record: slo:sli_error:ratio_rate1h
    expr: |-
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService",grpc_code=~"Unknown|Internal|Unavailable|DeadlineExceeded|DataLoss"}[1h])))
      /
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService"}[1h])))
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
  - record: slo:sli_error:ratio_rate2h
    expr: |-
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService",grpc_code=~"Unknown|Internal|Unavailable|DeadlineExceeded|DataLoss"}[2h])))
      /
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService"}[2h])))
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
  - record: slo:sli_error:ratio_rate6h
    expr: |-
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService",grpc_code=~"Unknown|Internal|Unavailable|DeadlineExceeded|DataLoss"}[6h])))
      /
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService"}[6h])))
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
  - record: slo:sli_error:ratio_rate1d
    expr: |-
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService",grpc_code=~"Unknown|Internal|Unavailable|DeadlineExceeded|DataLoss"}[1d])))
      /
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService"}[1d])))
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
  - record: slo:sli_error:ratio_rate3d
    expr: |-
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService",grpc_code=~"Unknown|Internal|Unavailable|DeadlineExceeded|DataLoss"}[3d])))
      /
      (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService"}[3d])))
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
  - record: slo:sli_bad:rate5m
    expr: (sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService",grpc_code=~"Unknown|Internal|Unavailable|DeadlineExceeded|DataLoss"}[5m]))) or vector(0)
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
  - record: slo:sli_total:rate5m
    expr: sum(rate(grpc_server_handled_total{grpc_service="profile.v1.ProfileService"}[5m]))
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
  - record: slo:period_error:ratio
    expr: |-
      sum_over_time(slo:sli_bad:rate5m{slo_service="customer-profile", slo_name="availability"}[28d])
      /
      sum_over_time(slo:sli_total:rate5m{slo_service="customer-profile", slo_name="availability"}[28d])
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
      slo_window: 28d
  - record: slo:objective:ratio
    expr: vector(0.9995)
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
  - record: slo:error_budget:ratio
    expr: vector(0.0005)
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
  - record: slo:error_budget_remaining:ratio
    expr: 1 - (slo:period_error:ratio{slo_service="customer-profile", slo_name="availability"} / 0.0005)
    labels:
      slo_service: customer-profile
      slo_name: availability
      slo_owner: identity-platform
      slo_window: 28d
  - alert: CustomerProfileAvailabilityErrorBudgetBurn
    expr: |-
      (
        slo:sli_error:ratio_rate1h{slo_service="customer-profile", slo_name="availability"} > (13.44 * 0.0005)
        and
        slo:sli_error:ratio_rate5m{slo_service="customer-profile", slo_name="availability"} > (13.44 * 0.0005)
      )
      or
      (
        slo:sli_error:ratio_rate6h{slo_service="customer-profile", slo_name="availability"} > (5.6 * 0.0005)
        and
        slo:sli_error:ratio_rate30m{slo_service="customer-profile", slo_name="availability"} > (5.6 * 0.0005)
      )
    labels:
      severity: critical
      team: identity-platform
      slo_service: customer-profile
      slo_name: availability
    annotations:
      summary: customer-profile availability SLO is burning its error budget too fast
      description: 'Objective 99.95% over 28d. Fires when the error rate would spend 2% of the 28d budget in 1h (burn rate 13.44x, confirmed over 5m); 5% of the 28d budget in 6h (burn rate 5.6x, confirmed over 30m). Long-window error ratio: {{ $value | humanizePercentage }}.'
  - alert: CustomerProfileAvailabilityErrorBudgetBurn
    expr: |-
      (
        slo:sli_error:ratio_rate1d{slo_service="customer-profile", slo_name="availability"} > (2.8 * 0.0005)
        and
        slo:sli_error:ratio_rate2h{slo_service="customer-profile", slo_name="availability"} > (2.8 * 0.0005)
      )
      or
      (
        slo:sli_error:ratio_rate3d{slo_service="customer-profile", slo_name="availability"} > (0.933333 * 0.0005)
        and
        slo:sli_error:ratio_rate6h{slo_service="customer-profile", slo_name="availability"} > (0.933333 * 0.0005)
      )
    labels:
      severity: warning
      team: identity-platform
      slo_service: customer-profile
      slo_name: availability
    annotations:
      summary: customer-profile availability SLO is burning its error budget too fast
      description: 'Objective 99.95% over 28d. Fires when the error rate would spend 10% of the 28d budget in 1d (burn rate 2.8x, confirmed over 2h); 10% of the 28d budget in 3d (burn rate 0.933333x, confirmed over 6h). Long-window error ratio: {{ $value | humanizePercentage }}.'
